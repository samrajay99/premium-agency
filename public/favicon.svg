<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1f0a18" />
      <stop offset="70%" stop-color="#0c050a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Gold Gradient for Crown & Borders -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe277" />
      <stop offset="35%" stop-color="#f5b324" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f5b324" />
    </linearGradient>

    <!-- Crimson / Rose Gold Gradient -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081" />
      <stop offset="50%" stop-color="#e11d74" />
      <stop offset="100%" stop-color="#9c0944" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Circle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Inner Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#roseGrad)" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="8 8" />

  <!-- Background Ambient Rose Glow -->
  <circle cx="256" cy="230" r="140" fill="#e11d74" fill-opacity="0.18" filter="url(#roseGlow)" />

  <!-- Royal VIP Crown Inset -->
  <g filter="url(#goldGlow)">
    <!-- Crown Base Arch -->
    <path d="M140 280 L372 280 L350 310 L162 310 Z" fill="url(#goldGrad)" />
    <!-- Crown Jewels on Base -->
    <circle cx="180" cy="295" r="7" fill="#ffffff" />
    <circle cx="256" cy="295" r="9" fill="url(#roseGrad)" />
    <circle cx="332" cy="295" r="7" fill="#ffffff" />

    <!-- Crown Peaks -->
    <path d="M140 280 L120 185 L185 235 L256 140 L327 235 L392 185 L372 280 Z" fill="url(#goldGrad)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Crown Peak Jewels -->
    <circle cx="120" cy="180" r="12" fill="url(#roseGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="256" cy="132" r="16" fill="url(#roseGrad)" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="392" cy="180" r="12" fill="url(#roseGrad)" stroke="#ffffff" stroke-width="3" />
    
    <!-- Central Diamond Star Accent -->
    <path d="M256 195 L263 218 L286 225 L263 232 L256 255 L249 232 L226 225 L249 218 Z" fill="#ffffff" />
  </g>

  <!-- VIP Lettermark -->
  <text x="256" y="390" text-anchor="middle" font-family="'Playfair Display', 'Times New Roman', serif" font-size="70" font-weight="900" letter-spacing="12" fill="url(#goldGrad)" filter="url(#goldGlow)">
    VIP
  </text>
  
  <!-- Subtle Elite Subtitle -->
  <text x="256" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="8" fill="#f43f5e">
    HYDERABAD
  </text>
</svg>